name: Notify leads to Telegram

on:
  schedule:
    # Каждые 15 минут
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: notify-leads
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Python 3 уже предустановлен на ubuntu-latest — setup-python не нужен
      - name: Install dependencies
        run: pip install --quiet --disable-pip-version-check requests

      - name: Notify new leads
        timeout-minutes: 3
        run: python notify_leads.py
